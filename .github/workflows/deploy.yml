name: Deploy

# Every push to main (a merged release or hotfix PR) builds and uploads to TestFlight.
# Submitting that build for App Store review is done by hand in App Store Connect.
# It can also be run by hand (Actions tab, or `gh workflow run deploy.yml --ref <branch>`);
# a manual run uploads too, and waits for approval if the environment requires it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy half way through, but do not run two at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: TestFlight
    runs-on: ${{ vars.MACOS_VERSION }}
    timeout-minutes: 60
    # Holds the signing and App Store Connect secrets. Add required reviewers
    # to this environment in the repository settings for a manual gate.
    environment: testflight
    env:
      XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      ENABLE_DEPLOY: "1"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        if: ${{ env.XCODE_VERSION != '' }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Install signing certificate and profile
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/deploy.keychain-db"
          cert_file="$RUNNER_TEMP/dist.p12"
          profile_file="$RUNNER_TEMP/app.mobileprovision"
          echo "$CERT_P12" | base64 --decode > "$cert_file"
          echo "$PROFILE" | base64 --decode > "$profile_file"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$cert_file" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile_file" > "$profile_plist"
          uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$profile_plist")
          name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$profile_plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_file" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        run: fastlane beta

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/deploy.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
          [ -z "${PROFILE_PATH:-}" ] || rm -f "$PROFILE_PATH"
