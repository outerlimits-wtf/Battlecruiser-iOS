name: CI

on:
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
  push:
    branches: [develop, main]

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ vars.MACOS_VERSION }}
    timeout-minutes: 30
    env:
      # Set repository variables XCODE_VERSION (e.g. "27.0") and SIMULATOR_DEVICE
      # (e.g. "iPhone 17") if the runner's defaults do not match the project.
      XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      SIMULATOR_DEVICE: ${{ vars.SIMULATOR_DEVICE }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: ${{ env.XCODE_VERSION != '' }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          fastlane --version

      # CI uses the runner's fastlane, so fail loudly if the image moves off the
      # version in the Gemfile. Update both together after trying the new version.
      - name: Check fastlane version
        run: |
          expected=$(sed -n 's/.*gem "fastlane", "\(.*\)".*/\1/p' Gemfile)
          actual=$(fastlane --version | sed -n 's/^fastlane \([0-9.]*\)$/\1/p' | tail -n 1)
          echo "expected=$expected actual=$actual"
          [ -n "$expected" ] && [ "$expected" = "$actual" ]

      - name: Run tests
        run: fastlane test

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: fastlane/test_output
          if-no-files-found: ignore
          retention-days: 7
