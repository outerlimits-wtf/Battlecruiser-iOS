name: CI

on:
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
  push:
    branches: [develop]

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    # develop -> main PRs are not retested: develop is already tested by its own PRs
    # and pushes. A job skipped by its own `if` counts as passing for required checks.
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop') }}
    runs-on: ${{ vars.MACOS_VERSION }}
    timeout-minutes: 30
    env:
      # Set repository variables XCODE_VERSION (e.g. "27.0") and SIMULATOR_DEVICE
      # (e.g. "iPhone 17") if the runner's defaults do not match the project.
      XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      SIMULATOR_DEVICE: ${{ vars.SIMULATOR_DEVICE }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        if: ${{ env.XCODE_VERSION != '' }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          fastlane --version

      - name: Run tests
        run: fastlane test
